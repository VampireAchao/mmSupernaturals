name: Release

# A release is a tag. The version in pom.xml and the tag have to agree, and the guard below is what
# keeps them from drifting: a tag is cheap to type and it is the one thing about a release that
# cannot be taken back.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against the pom
        run: |
          pom="$(grep -m1 -o '<version>[^<]*</version>' pom.xml | sed 's/<[^>]*>//g')"
          tag="${GITHUB_REF_NAME#v}"
          echo "pom.xml says $pom, the tag says $tag"
          if [ "$pom" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $pom in pom.xml"
            exit 1
          fi
          echo "VERSION=$pom" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unit tests, then the jar. The scenario tests boot a real Paper server, which is why they sit
      # behind the `it` profile and stay a local step: a release should be gated on the tests that
      # can run anywhere, and `mvn verify -Pit` is run by hand before the tag is pushed.
      - name: Build
        run: mvn -B -ntp verify

      - name: Name the jar after the version
        run: mv server/plugins/mmSupernaturals.jar "mmSupernaturals-${VERSION}.jar"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "mmSupernaturals-${VERSION}.jar" \
            --title "$VERSION" --generate-notes

      # Every release page has to say whose plugin this is, in its first line - generated notes
      # never will, because it is not something a commit can tell you. So the statement is put in
      # front of them here, where nobody can forget it: the plugin continues a 2011 plugin whose
      # author and repository are gone, and it is neither official nor endorsed.
      - name: Say whose plugin this is
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/provenance.md <<'EOF'
          > **This is a community fork, not the original author's release.** mmSupernaturals continues
          > *Supernatural Players*, a Bukkit plugin published in 2011 by **Matterz**. The original
          > repository, the author's GitHub account and its dev.bukkit.org page all return 404 today;
          > this build is maintained by VampireAchao on top of [FaeyUmbrea's archived
          > fork](https://github.com/FaeyUmbrea/mmSupernaturals). It is not affiliated with,
          > authorised by, or endorsed by the original authors, who do not support it - please report
          > issues here. The evidence for this is in the repository README.
          EOF
          gh release view "$GITHUB_REF_NAME" --json body -q .body > /tmp/generated.md
          { cat /tmp/provenance.md; echo; cat /tmp/generated.md; } > /tmp/notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
          head -3 /tmp/notes.md
